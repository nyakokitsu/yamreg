services:
  yamreg:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - yamreg-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - yamreg
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  yamreg-data:
  caddy-data:
  caddy-config:
